name: Build and Push ProductHub Backend

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: prodcontainer-b6a9dycma5d8dpeg.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t prodcontainer-b6a9dycma5d8dpeg.azurecr.io/producthub-backend:latest \
            ./backend

      - name: Push Docker image
        run: |
          docker push \
            prodcontainer-b6a9dycma5d8dpeg.azurecr.io/producthub-backend:latest
